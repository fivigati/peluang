<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Kotak Misteri Peluang</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #f43f5e;
            --accent: #fbbf24;
            --success: #10b981;
            --bg-game: #f0f4ff;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: var(--bg-game);
            background-image: radial-gradient(#d1d5db 1px, transparent 1px);
            background-size: 20px 20px;
        }

        h1, h2, .font-title {
            font-family: 'Fredoka One', cursive;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 12px;
        }

        .mystery-box {
            aspect-ratio: 1;
            background: linear-gradient(135deg, #6366f1 0%, #4338ca 100%);
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            color: white;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 0 #312e81, 0 12px 15px rgba(0,0,0,0.1);
            position: relative;
            user-select: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .mystery-box:hover {
            transform: translateY(-5px);
            filter: brightness(1.1);
        }

        .mystery-box.opened {
            background: #e2e8f0;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.1);
            transform: none;
            cursor: default;
            color: #94a3b8;
            text-shadow: none;
        }

        .name-display {
            background: #fff;
            border: 4px solid var(--primary);
            border-radius: 24px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.1);
        }

        .rolling-text {
            font-size: 1.2rem;
            font-weight: 800;
            color: #4338ca;
            text-align: center;
            padding: 0 1rem;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.85);
            z-index: 50;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(8px);
        }

        .modal-content {
            background: white;
            padding: 2.5rem;
            border-radius: 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            position: relative;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.5);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .option-btn {
            width: 100%;
            padding: 1.2rem;
            margin: 0.5rem 0;
            background: #f8fafc;
            border: 3px solid #e2e8f0;
            border-radius: 20px;
            font-weight: 700;
            transition: all 0.2s;
            text-align: left;
            display: flex;
            align-items: center;
        }

        .option-btn:hover {
            background: #eef2ff;
            border-color: #6366f1;
            transform: translateX(8px);
        }
    </style>
</head>

        let score = 0;

        const totalBoxes = 30;
        let boxTypes = [];

        function initGame() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            
            // Mengatur tipe kotak secara acak: Q (Question), B (Bomb), G (Gift)
            boxTypes = new Array(totalBoxes).fill('Q');
            
            // Sisipkan Bom dan Bonus di posisi acak
            const positions = Array.from({length: totalBoxes}, (_, i) => i);
            for (let i = positions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [positions[i], positions[j]] = [positions[j], positions[i]];
            }

            boxTypes[positions[0]] = 'B'; 
            boxTypes[positions[1]] = 'B';
            boxTypes[positions[2]] = 'G';
            boxTypes[positions[3]] = 'G';

            for (let i = 0; i < totalBoxes; i++) {
                const box = document.createElement('div');
                box.className = 'mystery-box';
                box.innerText = i + 1;
                box.dataset.index = i;
                box.onclick = () => openBox(box);
                grid.appendChild(box);
            }
        }

            const target = document.getElementById('target-name');
            let counter = 0;
            const maxTicks = 25;
            
            const interval = setInterval(() => {
                const randomName = students[Math.floor(Math.random() * students.length)];
                target.innerText = randomName;
                target.style.opacity = (counter % 2 === 0) ? "0.5" : "1";
                counter++;
                
                if (counter >= maxTicks) {
                    clearInterval(interval);
                    target.style.opacity = "1";
                    target.innerText = "⭐ " + target.innerText + " ⭐";
                    isRolling = false;
                }
            }, 70);
        };

        function openBox(el) {
            if (el.classList.contains('opened')) return;

            const type = boxTypes[parseInt(el.dataset.index)];
            const modal = document.getElementById('modal');
            const body = document.getElementById('modal-body');
            modal.style.display = 'flex';

            if (type === 'B') {
                body.innerHTML = `
                    <div class="text-8xl mb-4 animate-bounce">💣</div>
                    <h2 class="text-4xl font-title text-red-600 mb-2">BOM MELEDAK!</h2>
                    <p class="text-gray-600 text-lg mb-8">Waduh, tim harus rela kehilangan 50 poin!</p>
                    <button onclick="resolveBox(true, ${el.dataset.index}, -50)" class="bg-red-500 text-white px-12 py-4 rounded-2xl font-bold shadow-xl hover:bg-red-600 active:scale-95 transition-all">TIDAAKK!</button>
                `;
            } else if (type === 'G') {
                body.innerHTML = `
                    <div class="text-8xl mb-4 animate-pulse">🎁</div>
                    <h2 class="text-4xl font-title text-green-600 mb-2">BONUS HADIAH!</h2>
                    <p class="text-gray-600 text-lg mb-8">Keberuntungan berpihak padamu! Tambahan 100 poin.</p>
                    <button onclick="resolveBox(true, ${el.dataset.index}, 100)" class="bg-green-500 text-white px-12 py-4 rounded-2xl font-bold shadow-xl hover:bg-green-600 active:scale-95 transition-all">TERIMA KASIH!</button>
                `;
            } else {
                // Pilih soal baru setiap kali kotak (yang belum terbuka permanen) diklik
                const qIdx = Math.floor(Math.random() * bankSoal.length);
                const q = bankSoal[qIdx];
                
                body.innerHTML = `
                    <div class="text-xs font-bold text-indigo-400 mb-4 uppercase tracking-[0.2em]">Tantangan Kotak Nomor ${parseInt(el.dataset.index)+1}</div>
                    <h2 class="text-xl md:text-2xl font-bold text-gray-800 mb-8 text-left leading-relaxed">${q.q}</h2>
                    <div class="space-y-3">
                        ${q.o.map((opt, idx) => `
                            <button onclick="checkAnswer(${idx}, ${q.a}, ${el.dataset.index})" class="option-btn group">
                                <span class="w-10 h-10 flex items-center justify-center bg-indigo-100 text-indigo-600 rounded-xl mr-4 group-hover:bg-indigo-600 group-hover:text-white transition-colors">${String.fromCharCode(65+idx)}</span> 
                                <span class="text-lg">${opt}</span>
                            </button>
                        `).join('')}
                    </div>
                    <div class="mt-10 flex justify-center border-t pt-6">
                        <button onclick="closeModal()" class="text-gray-400 hover:text-rose-500 font-bold transition-colors">LEWATI KOTAK INI</button>
                    </div>
                `;
            }
        }

        function checkAnswer(selected, correct, boxIdx) {
            const body = document.getElementById('modal-body');
            if (selected === correct) {
                body.innerHTML = `
                    <div class="text-8xl mb-6">🤩</div>
                    <h2 class="text-5xl font-title text-emerald-500 mb-4">BENAR!</h2>
                    <p class="text-gray-600 mb-10 text-xl font-medium">Hebat! Kamu berhasil menjawab dengan tepat. Tim mendapatkan 20 poin!</p>
                    <button onclick="resolveBox(true, ${boxIdx}, 20)" class="bg-indigo-600 text-white px-14 py-5 rounded-[25px] font-bold text-2xl shadow-2xl hover:bg-indigo-700 active:scale-95 transition-all">AMBIL POIN</button>
                `;
            } else {
                body.innerHTML = `
                    <div class="text-8xl mb-6">❌</div>
                    <h2 class="text-5xl font-title text-rose-500 mb-4">SALAH!</h2>
                    <p class="text-gray-600 mb-10 text-xl font-medium">Ups, jawabannya belum tepat. <br>Kotak akan ditutup lagi, pelajari lagi materinya ya!</p>
                    <button onclick="closeModal()" class="bg-slate-800 text-white px-14 py-5 rounded-[25px] font-bold text-2xl shadow-2xl active:scale-95 transition-all">COBA LAGI NANTI</button>
                `;
            }
        }

        function resolveBox(isFinished, boxIdx, pointChange) {
            score += pointChange;
            if (score < 0) score = 0;
            document.getElementById('score-val').innerText = score;

            if (isFinished) {
                const box = document.querySelector(`.mystery-box[data-index="${boxIdx}"]`);
                box.classList.add('opened');
                box.innerHTML = '⭐'; // Tanda kotak sudah selesai
                box.onclick = null;
            }
            closeModal();
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        window.onload = initGame;
    </script>
</body>
</html>
